name: Run Admin Script

# Manually triggered one-off runner for scripts/*.mjs admin scripts (e.g. Firestore
# seeding) that need the wc26picks service account. Reuses the same
# FIREBASE_SERVICE_ACCOUNT_WC26PICKS secret the hosting-deploy workflows already use,
# so no service account key needs to be downloaded or shared by hand.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or ref to check out (where the script lives)'
        required: true
        default: 'main'
      script:
        description: 'Path to script to run (relative to repo root)'
        required: true
        default: 'scripts/seed-scoring-config.mjs'
      args:
        description: 'Extra CLI flags to pass to the script (e.g. --write)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  run_script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.1'

      - name: Install dependencies
        run: npm install

      - name: Write service account key
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WC26PICKS }}
        run: echo "$SERVICE_ACCOUNT_JSON" > "${{ runner.temp }}/service-account.json"

      - name: Run script
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: node "${{ inputs.script }}" ${{ inputs.args }}
