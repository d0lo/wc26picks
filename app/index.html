<!DOCTYPE html>
<html lang="en" style="background:#080e0a">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#080e0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>WC 2026 Predictor</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>"
    />
  </head>
  <body>
    <div id="app"></div>
    <script>
      // iOS Safari only composites real page pixels behind its translucent
      // status bar / home indicator chrome once the document has a non-zero
      // scroll position. Run this before Vue mounts (screen still blank)
      // so the one-time nudge isn't visible as a jump on the rendered app.
      // `body` is 1px taller than `html` (see style.css) for real scroll room.
      document.documentElement.style.overflow = 'scroll'
      window.scrollTo(0, 1)
      document.documentElement.style.overflow = 'hidden'
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
